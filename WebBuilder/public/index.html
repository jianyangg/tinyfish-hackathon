<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Frontend Prototype Builder</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card hero">
        <h1>Prototype Builder</h1>
        <p>Provide a JSON list of pitches. Each pitch generates an independent website, deployed on localhost and previewed in its own iframe.</p>
      </section>

      <section class="card">
        <form id="pitch-form">
          <label for="pitch">JSON pitches</label>
          <textarea id="pitch" name="pitch" rows="8" placeholder='[{"title":"Neighbor Tool Exchange","whatToBuild":"A platform that helps neighbors trade tools and schedule pickups with one tap.","expectedUser":"People living in dense apartment communities.","additionalContext":"Mobile-first, include trust indicators and quick scheduling flow."},{"title":"Student Budget Snapshot","whatToBuild":"A minimalist expense tracker with weekly insights.","expectedUser":"Students managing tight monthly budgets.","additionalContext":"Needs quick-add UX and clear charts for spending patterns."}]' required></textarea>
          <button id="submit-btn" type="submit">Generate Websites</button>
        </form>
      </section>

      <section id="sessions-container" class="sessions-grid"></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
